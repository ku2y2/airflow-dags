# Airflow Values based on working sample.yaml
# Adapted for Airflow 2.7.0, MySQL, MinIO, and minikube

# Use default Airflow 2.10.2 image (latest stable with better provider support)
images:
  airflow:
    repository: apache/airflow
    tag: "2.10.2"
    pullPolicy: IfNotPresent

defaultAirflowRepository: apache/airflow
defaultAirflowTag: "2.10.2"

# Airflow version 2.10.2
airflowVersion: "2.10.2"

# Executor configuration
executor: KubernetesExecutor

# DAGs configuration with Git Sync
dags:
  persistence:
    enabled: false
    size: 4Gi
    storageClassName: ""
    accessMode: ReadWriteMany
  gitSync:
    enabled: false

# Disable built-in PostgreSQL
postgresql:
  enabled: false

# Disable pgbouncer (using MySQL directly)
pgbouncer:
  enabled: false

# Database configuration (MySQL)
data:
  metadataConnection:
    user: airflow
    pass: airflow123
    protocol: mysql
    host: mysql-service
    port: 3306
    db: airflow
    sslmode: disable

# Security keys (using the same as your sample)
fernetKey: "81HqDtbqAywKSOumSHA3BhWNOdQ26slT6K0YaZeZyPs="
webserverSecretKey: "your-secret-key-here-change-in-production"

# Disable flower and redis (not needed for KubernetesExecutor)
flower:
  enabled: false
redis:
  enabled: false

# Service account (simplified for local)
serviceAccount:
  create: true
  name: ""
  annotations: {}

# StatsD (simplified for local)
statsd:
  enabled: false

# Workers configuration (reduced for local)
workers:
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  env:
    - name: AIRFLOW_ENV
      value: "development"

# Scheduler configuration (reduced for local)
scheduler:
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# Triggerer configuration (reduced for local)
triggerer:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# Webserver configuration (reduced for local)
webserver:
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@example.com
    firstName: admin
    lastName: user
    password: admin
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# User and migration jobs
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

# Airflow configuration
config:
  core:
    max_active_runs_per_dag: 1
    parallelism: 32  # Reduced for local
    dags_are_paused_at_creation: "True"
    load_examples: "False"
    executor: KubernetesExecutor
  logging:
    # Remote logging to MinIO (S3-compatible)
    remote_logging: "True"
    remote_base_log_folder: "s3://airflow-logs/"
    remote_log_conn_id: "minio_default"
    encrypt_s3_logs: "False"
    logging_level: "INFO"
  webserver:
    default_ui_timezone: "UTC"
    warn_deployment_exposure: "False"
    show_trigger_form_if_no_params: "True"
    expose_config: "True"
  kubernetes:
    namespace: default
    worker_container_repository: apache/airflow
    worker_container_tag: "2.10.2"
    delete_worker_pods: "True"

# Environment variables for MinIO connection
env:
  - name: AIRFLOW_CONN_MINIO_DEFAULT
    value: "s3://minioadmin:minioadmin123@minio-service:9000?host=http://minio-service:9000&region=us-east-1"

---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword123"
        - name: MYSQL_DATABASE
          value: "airflow"
        - name: MYSQL_USER
          value: "airflow"
        - name: MYSQL_PASSWORD
          value: "airflow123"
        ports:
        - containerPort: 3306
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP

---
# MinIO Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command:
        - /bin/bash
        - -c
        args:
        - minio server /data --console-address :9090
        env:
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin123"
        ports:
        - containerPort: 9000
        - containerPort: 9090
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - name: minio-storage
          mountPath: /data
      volumes:
      - name: minio-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9090
    targetPort: 9090
  type: ClusterIP