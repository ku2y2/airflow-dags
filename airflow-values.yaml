# Apache Airflow Helm Values for Kubernetes Deployment
# Simplified working configuration

# Executor configuration
executor: KubernetesExecutor

# Airflow configuration
airflow:
  config:
    AIRFLOW__CORE__EXECUTOR: KubernetesExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__WEBSERVER__RBAC: "True"
    # MySQL Database Configuration
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql://airflow:airflow123@mysql-service:3306/airflow
    # MinIO Configuration for Remote Logging
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: minio_conn
    # Kubernetes Executor Configuration
    AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: default
    AIRFLOW__KUBERNETES_EXECUTOR__WORKER_CONTAINER_REPOSITORY: apache/airflow
    AIRFLOW__KUBERNETES_EXECUTOR__WORKER_CONTAINER_TAG: "2.10.5"
    AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS: "True"

# DAGs configuration with Git Sync (your public repository)
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/kundankumar/airflow-dags.git
    branch: airflow-kubernetes-deployment
    rev: HEAD
    depth: 1
    maxFailures: 0
    subPath: "dags"
    wait: 60

# Webserver configuration
webserver:
  service:
    type: ClusterIP
    ports:
      - name: airflow-ui
        port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Scheduler configuration
scheduler:
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Workers configuration (for KubernetesExecutor)
workers:
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Disable built-in PostgreSQL
postgresql:
  enabled: false

# Disable built-in Redis (not needed for KubernetesExecutor)
redis:
  enabled: false

# Environment variables and secrets
env:
  - name: AIRFLOW__WEBSERVER__SECRET_KEY
    value: "your-secret-key-here-change-in-production"
  - name: AIRFLOW__CORE__FERNET_KEY
    value: "81HqDtbqAywKSOumSHA3BhWNOdQ26slT6K0YaZeZyPs="

# Connection secrets
secret:
  - envName: AIRFLOW_CONN_MINIO_CONN
    secretName: airflow-connections
    secretKey: minio-conn
  - envName: AIRFLOW_CONN_MYSQL_CONN
    secretName: airflow-connections
    secretKey: mysql-conn

# Service account
serviceAccount:
  create: true

# RBAC
rbac:
  create: true

# Flower (disable for KubernetesExecutor)
flower:
  enabled: false

# StatsD (optional)
statsd:
  enabled: false

# Logs persistence (disabled as we're using MinIO)
logs:
  persistence:
    enabled: false

---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword123"
        - name: MYSQL_DATABASE
          value: "airflow"
        - name: MYSQL_USER
          value: "airflow"
        - name: MYSQL_PASSWORD
          value: "airflow123"
        ports:
        - containerPort: 3306
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP

---
# MinIO Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command:
        - /bin/bash
        - -c
        args:
        - minio server /data --console-address :9090
        env:
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin123"
        ports:
        - containerPort: 9000
        - containerPort: 9090
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9090
    targetPort: 9090
  type: ClusterIP

---
# Airflow Connections Secret
apiVersion: v1
kind: Secret
metadata:
  name: airflow-connections
type: Opaque
stringData:
  minio-conn: "s3://minioadmin:minioadmin123@minio-service:9000?region=us-east-1&host=http://minio-service:9000"
  mysql-conn: "mysql://airflow:airflow123@mysql-service:3306/airflow"