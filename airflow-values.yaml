
# Use custom Airflow 2.10.2 image with dbt and additional packages
images:
  airflow:
    repository: custom-airflow
    tag: "2.10.2"
    pullPolicy: IfNotPresent

defaultAirflowRepository: custom-airflow
defaultAirflowTag: "2.10.2"

# Airflow version 2.10.2
airflowVersion: "2.10.2"

# Executor configuration
executor: KubernetesExecutor

# DAGs configuration with Git Sync
dags:
  persistence:
    enabled: false
    size: 4Gi
    storageClassName: ""
    accessMode: ReadWriteMany
  gitSync:
    enabled: true
    repo: https://github.com/ku2y2/airflow-dags.git
    branch: airflow-kubernetes-deployment
    rev: HEAD
    depth: 1
    maxFailures: 0
    subPath: "dags"
    wait: 60
    containerName: git-sync
    uid: 65533

# Disable built-in PostgreSQL
postgresql:
  enabled: false

# Disable pgbouncer (using MySQL directly)
pgbouncer:
  enabled: false

# Database configuration (MySQL)
data:
  metadataConnection:
    user: airflow
    pass: airflow123
    protocol: mysql
    host: mysql-service
    port: 3306
    db: airflow
    sslmode: disable

# Security keys (using the same as your sample)
fernetKey: "81HqDtbqAywKSOumSHA3BhWNOdQ26slT6K0YaZeZyPs="
webserverSecretKey: "your-secret-key-here-change-in-production"

# Disable flower and redis (not needed for KubernetesExecutor)
flower:
  enabled: false
redis:
  enabled: false

# Service account (simplified for local)
serviceAccount:
  create: true
  name: ""
  annotations: {}

# StatsD (simplified for local)
statsd:
  enabled: false

# Workers configuration (reduced for local)
workers:
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  env:
    - name: AIRFLOW_ENV
      value: "development"

# Scheduler configuration (reduced for local)
scheduler:
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# Triggerer configuration (reduced for local)
triggerer:
  enabled: true
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# Webserver configuration (reduced for local)
webserver:
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    email: admin@example.com
    firstName: admin
    lastName: user
    password: admin
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# User and migration jobs
createUserJob:
  useHelmHooks: false
  applyCustomEnv: false
migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

# Disable log persistence
logs:
  persistence:
    enabled: false

# Airflow configuration
config:
  core:
    max_active_runs_per_dag: 1
    parallelism: 32  # Reduced for local
    dags_are_paused_at_creation: "True"
    load_examples: "False"
    executor: KubernetesExecutor
  logging:
    # Remote logging to MinIO (S3-compatible)
    remote_logging: "True"
    remote_base_log_folder: "s3://airflow-logs/"
    remote_log_conn_id: "minio_default"
    encrypt_s3_logs: "False"
    logging_level: "INFO"
  webserver:
    default_ui_timezone: "UTC"
    warn_deployment_exposure: "False"
    show_trigger_form_if_no_params: "True"
    expose_config: "True"
  kubernetes:
    namespace: default
    worker_container_repository: custom-airflow
    worker_container_tag: "2.10.2"
    delete_worker_pods: "True"

# Environment variables for MinIO connection and S3 logging
env:
  - name: AIRFLOW_CONN_MINIO_DEFAULT
    value: "aws://minioadmin:minioadmin123@?region_name=us-east-1&host=http://minio-service:9000"
  - name: AWS_ACCESS_KEY_ID
    value: "minioadmin"
  - name: AWS_SECRET_ACCESS_KEY
    value: "minioadmin123"
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"
  - name: AWS_ENDPOINT_URL_S3
    value: "http://minio-service:9000"
  - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
    value: "minio_default"
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: "s3://airflow-logs"
