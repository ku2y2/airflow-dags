# Apache Airflow Helm Values for Kubernetes Deployment
# Configuration for Airflow 3.0 with MinIO, MySQL, and Git Sync

# Airflow version
images:
  airflow:
    repository: apache/airflow
    tag: "2.10.5"
    pullPolicy: IfNotPresent

# Airflow configuration
airflow:
  # Airflow configuration
  config:
    AIRFLOW__CORE__EXECUTOR: KubernetesExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    AIRFLOW__WEBSERVER__RBAC: "True"

    # MySQL Database Configuration
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql://airflow:airflow123@mysql-service:3306/airflow

    # MinIO Configuration for Remote Logging
    AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: minio_conn

    # Kubernetes Executor Configuration
    AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: default
    AIRFLOW__KUBERNETES_EXECUTOR__WORKER_CONTAINER_REPOSITORY: apache/airflow
    AIRFLOW__KUBERNETES_EXECUTOR__WORKER_CONTAINER_TAG: "2.10.5"
    AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS: "True"

# Executor configuration
executor: KubernetesExecutor

# DAGs configuration - disable Git Sync for now
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# Webserver configuration
webserver:
  service:
    type: ClusterIP
    ports:
      - name: airflow-ui
        port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Scheduler configuration
scheduler:
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Workers configuration (for KubernetesExecutor)
workers:
  persistence:
    enabled: false
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Disable built-in PostgreSQL
postgresql:
  enabled: false

# Disable built-in Redis (not needed for KubernetesExecutor)
redis:
  enabled: false

# Create admin user
createUserJob:
  useHelmHooks: false

# Environment variables and secrets
env:
  - name: AIRFLOW__WEBSERVER__SECRET_KEY
    value: "your-secret-key-here-change-in-production"
  - name: AIRFLOW__CORE__FERNET_KEY
    value: "81HqDtbqAywKSOumSHA3BhWNOdQ26slT6K0YaZeZyPs="

# External database configuration
data:
  metadataConnection:
    user: airflow
    pass: airflow123
    protocol: mysql
    host: mysql-service
    port: 3306
    db: airflow

# Fernet key configuration
fernetKey: "81HqDtbqAywKSOumSHA3BhWNOdQ26slT6K0YaZeZyPs="

# Webserver secret key
webserverSecretKey: "your-secret-key-here-change-in-production"

# Connection secrets
secret:
  - envName: AIRFLOW_CONN_MINIO_CONN
    secretName: airflow-connections
    secretKey: minio-conn
  - envName: AIRFLOW_CONN_MYSQL_CONN
    secretName: airflow-connections
    secretKey: mysql-conn

# Service account
serviceAccount:
  create: true
  name: airflow

# RBAC
rbac:
  create: true

# Extra pip packages
extraPipPackages:
  - "dbt-core>=1.8.0"
  - "dbt-postgres>=1.8.0"
  - "apache-airflow-providers-dbt-cloud>=3.5.0"
  - "boto3>=1.34.0"
  - "minio>=7.2.0"

# Flower (disable for KubernetesExecutor)
flower:
  enabled: false

# StatsD (optional)
statsd:
  enabled: false

# Logs persistence (disabled as we're using MinIO)
logs:
  persistence:
    enabled: false